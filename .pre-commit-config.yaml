# instalação (uma vez por clone):  backend\.venv\Scripts\pre-commit.exe install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^backend/carrermatch/db/seeds/seed\.sql$

  # pre-commit-hooks via `python -m` (não pelos .exe gerados pelo pip): o Controle de
  # Aplicativos do Windows bloqueia esses executáveis não assinados; o python.exe é assinado.
  # chaves privadas: cobertas pelo PrivateKeyDetector do detect-secrets
  - repo: local
    hooks:
      - id: check-added-large-files
        name: bloquear arquivos grandes (>1 MB)
        entry: python -m pre_commit_hooks.check_added_large_files --maxkb=1024
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
      - id: check-merge-conflict
        name: bloquear marcadores de conflito
        entry: python -m pre_commit_hooks.check_merge_conflict
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [text]
      # bloqueia .env commitado mesmo que alguém force o add
      - id: forbid-env-files
        name: bloquear arquivos .env
        entry: arquivos .env não podem ser commitados (use .env.example)
        language: fail
        files: (^|/)\.env($|\.(?!example$).+)
